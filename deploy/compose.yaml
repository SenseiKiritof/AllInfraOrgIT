name: infraorgit-deploy

# Stack from published images: no API/Web source checkout and no local build.
# Copy .env.example to .env, replace every CHANGE_ME_* secret, pin API_TAG and
# WEB_TAG to a version or sha-<commit> (main/dev/latest also need an
# API_DIGEST/WEB_DIGEST), then run the preflight before starting:
#   deploy/scripts/check-env.sh .env
#   docker compose --env-file .env -f compose.yaml up -d --wait
#
# Resource limits (PT-17). Every long-running service sets mem_limit, cpus and
# pids_limit; each value is overridable from .env. The defaults size a small
# single-host install: up to ~50 servers and ~20 concurrent users. mem_limit is
# a hard cgroup cap, so an undersized value OOM-kills the container instead of
# slowing it down (MySQL during an import, Keycloak during the realm import);
# pids_limit counts threads as well as processes. Raise the limits before a
# large inventory import or backup and check `docker stats` and
# `docker inspect --format '{{.State.OOMKilled}}' <container>` after a restart.
# The migrate/base-data one-shot jobs stay unlimited: they are short-lived and
# a too-low cap there would fail the first start.

services:
  mysql:
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    restart: unless-stopped
    # 1 GiB leaves room for the default 128 MiB InnoDB buffer pool plus
    # per-connection buffers; 512 threads covers MySQL internals and clients.
    mem_limit: ${MYSQL_MEM_LIMIT:-1g}
    cpus: "${MYSQL_CPUS:-1.0}"
    pids_limit: ${MYSQL_PIDS_LIMIT:-512}
    environment:
      MYSQL_DATABASE: infraorgit
      MYSQL_USER: infraorgit
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?definisci MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?definisci MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:13336:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mysql-keycloak:
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    restart: unless-stopped
    # Keycloak's database: smaller than the application database, but the same
    # MySQL baseline; 768 MiB keeps startup and the realm import out of OOM.
    mem_limit: ${KEYCLOAK_DB_MEM_LIMIT:-768m}
    cpus: "${KEYCLOAK_DB_CPUS:-1.0}"
    pids_limit: ${KEYCLOAK_DB_PIDS_LIMIT:-512}
    environment:
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?definisci KEYCLOAK_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${KEYCLOAK_DB_ROOT_PASSWORD:?definisci KEYCLOAK_DB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:13337:3306"
    volumes:
      - ./data/mysql-keycloak:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    restart: unless-stopped
    # Renders deploy/keycloak/realm-infraorgit.json into the import directory,
    # substituting the client/MCP secrets, the application admin password and
    # the optional TOTP browser flow (KEYCLOAK_MFA).
    entrypoint: ["/opt/keycloak/entrypoint.sh"]
    command: ["start", "--import-realm"]
    # Read-only rootfs. The upstream image augments Quarkus into
    # /opt/keycloak/lib/quarkus on start, so that path is a named volume
    # initialised from the image and writable only there. Remove the volume
    # after a Keycloak image upgrade if the cached augmentation prevents
    # startup: docker volume rm infraorgit-deploy_keycloak-quarkus.
    read_only: true
    # Quarkus derives the JVM heap from the container limit (70% max). Keycloak
    # recommends at least 750 MiB and ~2 GiB for a small production deployment;
    # the unoptimized image also augments Quarkus at startup, so keep headroom.
    mem_limit: ${KEYCLOAK_MEM_LIMIT:-2g}
    cpus: "${KEYCLOAK_CPUS:-2.0}"
    pids_limit: ${KEYCLOAK_PIDS_LIMIT:-1024}
    environment:
      KEYCLOAK_HOSTNAME: ${SITE_URL:-https://localhost:8443}
      KEYCLOAK_HOSTNAME_ADMIN: ${KEYCLOAK_HOSTNAME_ADMIN:-http://localhost:18081}
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql-keycloak:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?definisci KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?definisci KEYCLOAK_ADMIN_PASSWORD in .env}
      OIDC_CLIENT_SECRET: ${Oidc__ClientSecret:?definisci Oidc__ClientSecret in .env}
      MCP_CLIENT_SECRET: ${MCP_CLIENT_SECRET:?definisci MCP_CLIENT_SECRET in .env}
      INFRAORGIT_ADMIN_PASSWORD: ${INFRAORGIT_ADMIN_PASSWORD:?definisci INFRAORGIT_ADMIN_PASSWORD in .env}
      KEYCLOAK_MFA: ${KEYCLOAK_MFA:-false}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - ./keycloak/entrypoint.sh:/opt/keycloak/entrypoint.sh:ro
      - ./keycloak/realm-infraorgit.json:/opt/keycloak/realm/realm-infraorgit.json:ro
      - keycloak-quarkus:/opt/keycloak/lib/quarkus
    # /tmp and the import/cache directory are ephemeral; the entrypoint
    # renders the realm into /opt/keycloak/data/import on every start.
    tmpfs:
      - /tmp
      - /opt/keycloak/data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      mysql-keycloak:
        condition: service_healthy
    networks:
      - default
      - auth

  migrate:
    image: ${API_IMAGE:-ghcr.io/senseikiritof/infraorgit-api}:${API_TAG:?definisci API_TAG in .env}${API_DIGEST:+@}${API_DIGEST:-}
    command: ["migrate"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MySql: "Server=mysql;Port=3306;Database=infraorgit;User ID=infraorgit;Password=${MYSQL_PASSWORD};"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  base-data:
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?definisci MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - ./init/base-data.sql:/base-data.sql:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        mysql -h mysql -u root -p"$${MYSQL_ROOT_PASSWORD}" infraorgit < /base-data.sql

  api:
    image: ${API_IMAGE:-ghcr.io/senseikiritof/infraorgit-api}:${API_TAG:?definisci API_TAG in .env}${API_DIGEST:+@}${API_DIGEST:-}
    restart: unless-stopped
    # .NET runtime plus the SSH/file connectors: 768 MiB and 1 CPU is enough
    # for a small team; raise it with the inventory and the console usage.
    mem_limit: ${API_MEM_LIMIT:-768m}
    cpus: "${API_CPUS:-1.0}"
    pids_limit: ${API_PIDS_LIMIT:-512}
    depends_on:
      migrate:
        condition: service_completed_successfully
      base-data:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MySql: "Server=mysql;Port=3306;Database=infraorgit;User ID=infraorgit;Password=${MYSQL_PASSWORD};"
      Oidc__Issuer: ${OIDC_ISSUER:-https://localhost:8443/realms/infraorgit}
      Oidc__InternalIssuer: ${OIDC_INTERNAL_ISSUER:-http://keycloak:8080/realms/infraorgit}
      Oidc__AllowInsecureInternalDiscovery: "true"
      Oidc__ClientId: ${OIDC_CLIENT_ID:-infraorgit}
      Oidc__ClientSecret: ${Oidc__ClientSecret:?definisci Oidc__ClientSecret in .env}
      Oidc__RedirectUri: ${OIDC_REDIRECT_URI:-https://localhost:8443/auth/callback}
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-https://localhost:8443}
      Auth__SecureCookies: "true"
      Mcp__Enabled: ${MCP_ENABLED:-true}
      # Plain FTP is cleartext (PT-16). Off in deploy: the API refuses to save
      # or open a server with FileTransferProtocol=Ftp. SFTP and FTPS stay
      # available. Set FileTransfer__AllowPlainFtp=true only for a documented
      # legacy exception; check-env.sh warns when it is enabled.
      FileTransfer__AllowPlainFtp: ${FileTransfer__AllowPlainFtp:-false}
      DesktopDownloads__Enabled: ${DESKTOP_DOWNLOADS_ENABLED:-true}
      DesktopDownloads__PublicBaseUrl: ${DESKTOP_DOWNLOADS_PUBLIC_BASE_URL:-}
      DesktopDownloads__RetentionDays: ${DESKTOP_DOWNLOADS_RETENTION_DAYS:-30}
      DesktopDownloads__CleanupIntervalMinutes: ${DESKTOP_DOWNLOADS_CLEANUP_INTERVAL_MINUTES:-1440}
      Mcp__Oidc__Authority: ${MCP_OIDC_AUTHORITY:-https://localhost:8443/realms/infraorgit}
      Mcp__Oidc__MetadataAddress: ${MCP_OIDC_METADATA_ADDRESS:-http://keycloak:8080/realms/infraorgit/.well-known/openid-configuration}
      Mcp__Oidc__Issuer: ${MCP_OIDC_ISSUER:-https://localhost:8443/realms/infraorgit}
      Mcp__Oidc__Audience: ${MCP_OIDC_AUDIENCE:-infraorgit-mcp}
      Mcp__Oidc__RequireHttpsMetadata: "false"
      ServerAccess__CredentialKeys__1: ${ServerAccess__CredentialKey:?definisci ServerAccess__CredentialKey in .env}
      ServerAccess__CurrentKeyVersion: ${ServerAccess__CurrentKeyVersion:-1}
      ENC_KEY: ${ENC_KEY:-}
      DataProtection__KeysPath: /home/app/.aspnet/DataProtection-Keys
      SessionStore__MaxSessionsPerUser: ${SESSION_MAX_PER_USER:-10}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      ForwardedHeaders__KnownNetworks: ${FORWARDED_NETWORKS:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16}
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - api-dp-keys:/home/app/.aspnet/DataProtection-Keys
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -1 <&3 | grep -q \"200 OK\"'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - default
      - auth

  web:
    image: ${WEB_IMAGE:-ghcr.io/senseikiritof/infraorgit-web}:${WEB_TAG:?definisci WEB_TAG in .env}${WEB_DIGEST:+@}${WEB_DIGEST:-}
    restart: unless-stopped
    # The upstream Caddy image has no unprivileged user and its /data and
    # /config directories are root-owned. An arbitrary uid still works because
    # /data/caddy and /config/caddy are mode 1777 in the image (and in a fresh
    # named volume copied from it). On an existing root-run deployment, chown
    # the volumes once before switching (the project name is in `name:`):
    #   docker run --rm --user 0 --cap-drop ALL --cap-add CHOWN \
    #     -v infraorgit-deploy_caddy-data:/data \
    #     -v infraorgit-deploy_caddy-config:/config \
    #     --entrypoint chown <web-image> -R 10001:10001 /data /config
    user: "10001:10001"
    # Caddy is a reverse proxy in front of the API and Keycloak; 256 MiB and
    # half a CPU are enough unless static assets or uploads are served heavily.
    mem_limit: ${WEB_MEM_LIMIT:-256m}
    cpus: "${WEB_CPUS:-0.5}"
    pids_limit: ${WEB_PIDS_LIMIT:-256}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      API_UPSTREAM: ${API_UPSTREAM:-api:8080}
      KEYCLOAK_UPSTREAM: ${KEYCLOAK_UPSTREAM:-keycloak:8080}
    ports:
      # Loopback by default. Set WEB_BIND=0.0.0.0 (or a specific interface IP)
      # only for an intentional network exposure with TLS and firewall rules.
      - "${WEB_BIND:-127.0.0.1}:8443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    # Non-root needs NET_BIND_SERVICE for the 443 listener; the image's file
    # capability does not survive no-new-privileges, so grant it explicitly.
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy

networks:
  auth:
    internal: true

volumes:
  api-dp-keys:
  caddy-data:
  caddy-config:
  keycloak-quarkus:

        code:
          type: string
        traceId:
          type: string
      required:
      - title
      - status
    Paginated:
      type: object
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
      required:
      - items
      - total
      - page
      - pageSize
      description: Paginated list; items is typed per resource during implementation.
    Provider:
      type: object
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
        name:
          type: string
          maxLength: 200
        environmentCount:

name: e2e

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keycloak-login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    steps:
      - name: Checkout meta
        uses: actions/checkout@v4
        with:
          path: AllInfraOrgIT
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/InfraOrgITApi
          path: InfraOrgITApi
          token: ${{ secrets.REPO_TOKEN || github.token }}
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/InfraOrgITWeb
          path: InfraOrgITWeb
          token: ${{ secrets.REPO_TOKEN || github.token }}
      - name: Checkout docker
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/InfraOrgITDocker
          path: InfraOrgITDocker
          token: ${{ secrets.REPO_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            InfraOrgITApi/**/*.csproj
            AllInfraOrgIT/.config/dotnet-tools.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache Yarn and node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yarn
            InfraOrgITWeb/node_modules
          key: yarn-${{ runner.os }}-${{ hashFiles('InfraOrgITWeb/yarn.lock', 'InfraOrgITWeb/package.json') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('InfraOrgITWeb/yarn.lock', 'InfraOrgITWeb/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          # Warm the Docker images while Yarn and Playwright run.
          cp -n InfraOrgITDocker/.env.example InfraOrgITDocker/.env || true
          (docker compose --env-file InfraOrgITDocker/.env -f InfraOrgITDocker/compose.yaml pull mysql mysql-keycloak keycloak > /tmp/pull.log 2>&1) &
          pull_pid=$!
          npm install -g yarn@1.22.22
          yarn --cwd InfraOrgITWeb install --frozen-lockfile --prefer-offline
          yarn --cwd InfraOrgITWeb playwright install --with-deps chromium
          wait "$pull_pid" || cat /tmp/pull.log

      - name: Start stack
        run: |
          setsid make -C AllInfraOrgIT dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in $(seq 1 150); do
            if curl -fsS http://localhost:5298/health/ready >/dev/null &&
               curl -fsS http://localhost:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/dev.log
          exit 1

      - name: Playwright login
        run: make -C AllInfraOrgIT e2e

      - name: Stop stack
        if: always()
        run: |
          if [ -f /tmp/dev.pid ]; then
            kill -- -"$(cat /tmp/dev.pid)" 2>/dev/null || kill "$(cat /tmp/dev.pid)" 2>/dev/null || true
          fi
          if [ -f AllInfraOrgIT/Makefile ] && [ -f InfraOrgITDocker/compose.yaml ]; then
            make -C AllInfraOrgIT reset
          fi

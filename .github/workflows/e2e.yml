name: e2e

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  keycloak-login:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout meta
        uses: actions/checkout@v4
        with:
          path: AllInfraOrgIT
      - name: Require REPO_TOKEN
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          if [ -z "$REPO_TOKEN" ]; then
            echo "::error::REPO_TOKEN missing: sibling repos are private, github.token cannot read them (see docs/operations/first-push.md)."
            exit 1
          fi
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/InfraOrgITApi
          path: InfraOrgITApi
          token: ${{ secrets.REPO_TOKEN || github.token }}
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/InfraOrgITWeb
          path: InfraOrgITWeb
          token: ${{ secrets.REPO_TOKEN || github.token }}
      - name: Checkout docker
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/InfraOrgITDocker
          path: InfraOrgITDocker
          token: ${{ secrets.REPO_TOKEN || github.token }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          npm install -g yarn@1.22.22
          yarn --cwd InfraOrgITWeb install --frozen-lockfile
          yarn --cwd InfraOrgITWeb playwright install --with-deps chromium

      - name: Start stack
        run: |
          setsid make -C AllInfraOrgIT dev > /tmp/dev.log 2>&1 &
          echo $! > /tmp/dev.pid
          for i in $(seq 1 150); do
            if curl -fsS http://localhost:5298/health/ready >/dev/null &&
               curl -fsS http://localhost:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/dev.log
          exit 1

      - name: Playwright login
        run: make -C AllInfraOrgIT e2e

      - name: Stop stack
        if: always()
        run: |
          if [ -f /tmp/dev.pid ]; then
            kill -- -"$(cat /tmp/dev.pid)" 2>/dev/null || kill "$(cat /tmp/dev.pid)" 2>/dev/null || true
          fi
          if [ -f AllInfraOrgIT/Makefile ] && [ -f InfraOrgITDocker/compose.yaml ]; then
            make -C AllInfraOrgIT reset
          fi
